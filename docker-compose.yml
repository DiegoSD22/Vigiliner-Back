services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: vigiliner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigiliner
      POSTGRES_PASSWORD: vigiliner
      POSTGRES_DB: vigiliner
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=es_ES.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigiliner"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vigiliner_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vigiliner_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vigiliner_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis

networks:
  vigiliner_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
